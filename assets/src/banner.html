<!doctype html>
<html><head><meta charset="utf-8"><title>banner</title>
<style>
  html, body { margin: 0; width: 1280px; height: 420px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e6edf3;
    background:
      radial-gradient(900px 420px at 88% 30%, rgba(45, 212, 191, 0.18), transparent 60%),
      radial-gradient(700px 380px at 10% 110%, rgba(96, 165, 250, 0.22), transparent 60%),
      linear-gradient(135deg, #0b1020 0%, #0f1a36 55%, #0b1020 100%);
    position: relative;
  }
  .grid { position: absolute; inset: 0; opacity: .22;
    background-image: linear-gradient(rgba(148,163,184,.18) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.18) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent); }
  .left { position: absolute; left: 72px; top: 70px; width: 640px; }
  .kicker { font: 600 15px/1 "Cascadia Code", Consolas, monospace; color: #2dd4bf; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 18px 0 14px; font-size: 62px; line-height: 1.02; font-weight: 800; letter-spacing: -0.02em; }
  h1 span { background: linear-gradient(90deg, #5eead4, #60a5fa); -webkit-background-clip: text; color: transparent; }
  p { margin: 0; font-size: 21px; line-height: 1.45; color: #a9b8cc; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-size: 15px; font-weight: 600; padding: 8px 14px; border-radius: 999px; border: 1px solid rgba(148,163,184,.28); background: rgba(15, 23, 42, .6); color: #dbe7f5; }
  .chip b { color: #34d399; font-weight: 700; }
  .flow { position: absolute; right: 64px; top: 58px; width: 470px; height: 300px; }
  .flow svg { display: block; width: 470px; height: 300px; overflow: visible; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="kicker">Model Context Protocol · Bright Data</div>
    <h1>brightdata<span>-mcp-plus</span></h1>
    <p>A hardened, drop-in MCP server for live web data. Fetches pages for free when it can and pays for Bright Data only when a site fights back.</p>
    <div class="chips">
      <div class="chip"><b>Free</b> direct fetching</div>
      <div class="chip">34 tools</div>
      <div class="chip">Budgets &amp; caching</div>
      <div class="chip">stdio + HTTP</div>
      <div class="chip">SSRF-guarded</div>
      <div class="chip">70 tests</div>
    </div>
  </div>
  <div class="flow">
    <!-- one SVG for boxes, text and arrows, so every arrow tip lands exactly on its box edge -->
    <svg viewBox="0 0 470 300" font-family="Segoe UI, system-ui, sans-serif">
      <defs>
        <marker id="tip-grey" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
        <marker id="tip-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker>
        <marker id="tip-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".45"/></filter>
      </defs>

      <!-- edges (drawn first; each ends exactly on the target box's left edge) -->
      <path d="M120 150 H160" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#tip-grey)"/>
      <path d="M270 140 C 292 140, 288 66, 310 66" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#tip-green)"/>
      <path d="M270 160 C 292 160, 288 234, 310 234" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#tip-amber)"/>
      <text x="268" y="104" text-anchor="end" font-size="12.5" font-weight="700" fill="#34d399">first</text>
      <text x="268" y="207" text-anchor="end" font-size="12.5" font-weight="700" fill="#fbbf24">if blocked</text>

      <!-- boxes -->
      <rect x="155" y="113" width="120" height="74" rx="18" fill="none" stroke="#2dd4bf" stroke-opacity=".16" stroke-width="7"/>
      <g filter="url(#shadow)" fill="#0f172a">
        <rect x="0.5" y="118.5" width="119" height="63" rx="14" stroke="#94a3b8" stroke-opacity=".4"/>
        <rect x="160.5" y="118.5" width="109" height="63" rx="14" stroke="#2dd4bf" stroke-opacity=".85"/>
        <rect x="310.5" y="34.5" width="159" height="63" rx="14" stroke="#34d399" stroke-opacity=".85"/>
        <rect x="310.5" y="202.5" width="159" height="63" rx="14" stroke="#fbbf24" stroke-opacity=".8"/>
      </g>

      <!-- labels (right-hand boxes leave 18 px of padding after the longest line) -->
      <text x="60" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">AI agent</text>
      <text x="60" y="167" text-anchor="middle" font-size="12.5" fill="#94a3b8">Claude, Cursor…</text>
      <text x="215" y="146" text-anchor="middle" font-size="15" font-weight="600" fill="#e6edf3">MCP+</text>
      <text x="215" y="167" text-anchor="middle" font-size="12.5" fill="#94a3b8">pipeline</text>
      <circle cx="328" cy="61" r="4.5" fill="#34d399"/>
      <text x="339" y="66" font-size="15" font-weight="600" fill="#e6edf3">Free routes</text>
      <text x="326" y="87" font-size="12.5" fill="#94a3b8">direct · local Chrome</text>
      <circle cx="328" cy="229" r="4.5" fill="#fbbf24"/>
      <text x="339" y="234" font-size="15" font-weight="600" fill="#e6edf3">Bright Data</text>
      <text x="326" y="255" font-size="12.5" fill="#94a3b8">unblocker, billed</text>
    </svg>
  </div>
</body></html>
